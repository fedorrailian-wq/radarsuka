name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project archive
      run: |
        unzip -q radar.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        PROJECT_DIR=$(dirname $(find extracted_project -name "settings.gradle" -o -name "build.gradle" -print -quit))
        echo "Папка проекта: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        if [ -f "build.gradle" ] && ! grep -q "google()" build.gradle; then
          sed -i '/repositories {/a \    google()' build.gradle || true
        fi

        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "extracted_project/**/build/outputs/apk/debug/*.apk"
